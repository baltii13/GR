[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhino-mcp"
version = "0.1.0"
description = "MCP server that lets Claude control Rhino 7 through a listener script running inside Rhino"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rhino-mcp = "rhino_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["rhino_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
